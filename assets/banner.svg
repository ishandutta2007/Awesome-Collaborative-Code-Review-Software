<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g filter="url(#blur-glow)">
    <circle cx="180" cy="120" r="130" fill="url(#cyan-glow)">
      <animate attributeName="cx" values="180;230;180" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;160;120" dur="8s" repeatCount="indefinite" />
      <animate attributeName="r" values="130;150;130" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="240" r="140" fill="url(#purple-glow)">
      <animate attributeName="cx" values="1020;970;1020" dur="11s" repeatCount="indefinite" />
      <animate attributeName="cy" values="240;190;240" dur="9s" repeatCount="indefinite" />
      <animate attributeName="r" values="140;160;140" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Floating Circuit / Flow Lines (Background Layers) -->
  <g opacity="0.4">
    <!-- Line 1 -->
    <path d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="12s" repeatCount="indefinite" />
    </path>
    <!-- Line 2 -->
    <path d="M 80 320 Q 350 360 650 310 T 1120 320" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="14s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Dynamic Review Flow Pulses (Visualizing Peer Review Flow) -->
  <g opacity="0.75">
    <circle cx="600" cy="80" r="4" fill="#38bdf8">
      <animate attributeName="cx" values="200;1000;200" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="315" r="4" fill="#c084fc">
      <animate attributeName="cx" values="1000;200;1000" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Main Title & Badges Container -->
  <g id="foreground-content">
    <!-- Top Category Pill -->
    <g transform="translate(600, 52)">
      <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
      <!-- Animated Status Indicator Light -->
      <circle cx="-135" cy="0" r="5" fill="#10b981">
        <animate attributeName="r" values="4;6.5;4" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="-120" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.2">CURATED AWESOME LIST • 2026</text>
    </g>

    <!-- Main Title (Guaranteed Sharp Foreground) -->
    <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.8">
      Collaborative Code Review Software
    </text>

    <!-- Subtitle (Clear Foreground) -->
    <text x="600" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Peer Reviews • Pull Request Workflows • Self-Hosted Platforms • AI-Assisted Audits
    </text>

    <!-- Feature Pills in Center-Bottom -->
    <g transform="translate(600, 222)">
      <!-- Pill 1: Pre-Commit & Post-Commit -->
      <g transform="translate(-320, 0)">
        <rect x="-95" y="-15" width="190" height="30" rx="8" fill="#111827" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0f2fe">⚡ Pre-Commit &amp; PRs</text>
      </g>
      <!-- Pill 2: Git / SVN / Mercurial -->
      <g transform="translate(-105, 0)">
        <rect x="-95" y="-15" width="190" height="30" rx="8" fill="#111827" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff">🔀 Multi-VCS &amp; Diffing</text>
      </g>
      <!-- Pill 3: Self-Hosted & Air-Gapped -->
      <g transform="translate(105, 0)">
        <rect x="-95" y="-15" width="190" height="30" rx="8" fill="#111827" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f3e8ff">🛡️ Enterprise &amp; Self-Hosted</text>
      </g>
      <!-- Pill 4: AI & Automated Linting -->
      <g transform="translate(320, 0)">
        <rect x="-95" y="-15" width="190" height="30" rx="8" fill="#111827" fill-opacity="0.9" stroke="#34d399" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d1fae5">🤖 AI Agents &amp; Linters</text>
      </g>
    </g>

    <!-- Bottom Stat / Metric Highlights Bar -->
    <g transform="translate(600, 275)">
      <line x1="-350" y1="0" x2="350" y2="0" stroke="#334155" stroke-opacity="0.7" stroke-width="1" />
      <text x="-240" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🏢 SAAS PLATFORMS</text>
      <text x="0" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">⭐ OPEN SOURCE ENGINES</text>
      <text x="240" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">🔍 ZERO GUESSWORK PRICING</text>
    </g>
  </g>
</svg>
